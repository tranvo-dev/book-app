<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Book App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/auth.css}" href="css/auth.css" />
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
  <main class="w-full max-w-md">
    <a th:href="@{/login}" href="login.html" class="mb-6 flex items-center justify-center gap-2">
      <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-xl shadow-lg shadow-indigo-500/30">📚</span>
      <span class="text-xl font-extrabold text-slate-900">Book App</span>
    </a>

    <div class="auth-card p-8 sm:p-10">
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
        <p class="mt-2 text-sm text-slate-500">Start building your library today</p>
      </div>

      <div th:if="${param.error != null and param.error[0] == 'email_taken'}" class="auth-alert auth-alert-error visible">That email is already registered.</div>
      <div th:if="${param.error != null and param.error[0] == 'password_mismatch'}" class="auth-alert auth-alert-error visible">Passwords do not match.</div>
      <div th:if="${param.error != null and param.error[0] == 'password_length'}" class="auth-alert auth-alert-error visible">Password must be at least 8 characters.</div>
      <div th:if="${param.error != null and param.error[0] == 'missing'}" class="auth-alert auth-alert-error visible">Please fill in every field.</div>

      <form class="space-y-5" method="post" th:action="@{/register}" action="register">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="auth-label">First name</label>
            <input id="firstName" name="firstName" type="text" autocomplete="given-name" required class="auth-input" placeholder="Ada" th:value="${param.firstName}" />
          </div>
          <div>
            <label for="lastName" class="auth-label">Last name</label>
            <input id="lastName" name="lastName" type="text" autocomplete="family-name" required class="auth-input" placeholder="Lovelace" th:value="${param.lastName}" />
          </div>
        </div>

        <div>
          <label for="email" class="auth-label">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="auth-input" placeholder="you@example.com" th:value="${param.email}" />
        </div>

        <div>
          <label for="password" class="auth-label">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" class="auth-input pr-10" placeholder="••••••••" />
            <button type="button" class="auth-toggle-visibility" data-toggle-for="password" aria-label="Show password">
              <svg data-icon="eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg data-icon="eye-slash" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p class="auth-field-hint">At least 8 characters.</p>
        </div>

        <div>
          <label for="confirmPassword" class="auth-label">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required class="auth-input" placeholder="••••••••" />
        </div>

        <button type="submit" class="auth-btn-primary">Create account</button>
      </form>

      <div class="auth-divider">or</div>

      <p class="text-center text-sm text-slate-500">
        Already have an account?
        <a th:href="@{/login}" href="login.html" class="auth-link">Sign in</a>
      </p>
    </div>

    <p class="mt-8 text-center text-xs text-slate-400">© 2026 Book App. All rights reserved.</p>
  </main>

  <script>
    document.querySelectorAll('[data-toggle-for]').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.toggleFor);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        toggle.querySelector('[data-icon="eye"]').classList.toggle('hidden', isHidden);
        toggle.querySelector('[data-icon="eye-slash"]').classList.toggle('hidden', !isHidden);
        toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
