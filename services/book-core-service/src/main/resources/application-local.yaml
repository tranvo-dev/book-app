spring:
  application:
    name: book-core-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5432/book_app_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

cloudinary:
  cloud-name: null
  api-key: null
  api-secret: null

server:
  servlet:
    context-path: /

logging:
  level:
    # Resource Server: JWT decode + bearer token validation
    org.springframework.security: TRACE
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    # Logs inbound request incl. Authorization header
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    # BearerLoggingFilter — prints raw bearer token (local only)
    com.tranvodev.book_core_service.configs.BearerLoggingFilter: DEBUG