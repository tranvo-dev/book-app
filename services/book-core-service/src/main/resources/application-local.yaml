spring:
  application:
    name: book-core-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5433/book_core_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  cloud:
    gcp:
      project-id: book-app-498708
      credentials:
        location: classpath:keys/book-app-service-account-key.json
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

gcs:
  bucket-name: book-app-bucket

server:
  servlet:
    context-path: /

logging:
  level:
    # Resource Server: JWT decode + bearer token validation
    org.springframework.security: TRACE
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    # Logs inbound request incl. Authorization header
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    # BearerLoggingFilter — prints raw bearer token (local only)
    com.tranvodev.book_core_service.configs.BearerLoggingFilter: DEBUG